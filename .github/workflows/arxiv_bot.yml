name: arXiv Slack Bot

on:
  schedule:
    - cron: "30 14 * * 1-5"
      timezone: "Asia/Seoul"

  workflow_dispatch:
      inputs:
        test_mode:
          description: "Send one paper without saving history"
          required: false
          default: false
          type: boolean

concurrency:
  group: arxiv-slack-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run arXiv bot
        env:
          TEST_MODE: ${{ inputs.test_mode || 'false' }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
          GOOGLE_SHEETS_KEY: ${{ secrets.GOOGLE_SHEETS_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ARXIV_CONTACT_EMAIL: ${{ secrets.ARXIV_CONTACT_EMAIL }}
        run: python arxiv_slack_bot.py
